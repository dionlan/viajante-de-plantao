<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 400"
  preserveAspectRatio="xMidYMid slice"
  width="1600"
  height="400"
>
  <defs>
    <!-- Gradientes sutis para cada camada -->
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7fbf9" stop-opacity="1" />
      <stop offset="1" stop-color="#eaf6f1" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="g-mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#f1fbf8" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="g-front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Soft blur filter for smoother look on modern browsers -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>

    <!-- A small cloud shape to reuse -->
    <g id="cloud-shape">
      <path
        d="M50 30c-12 0-22 9-22 20s10 20 22 20h220c12 0 22-9 22-20s-10-20-22-20c-4 0-8 .8-11 2.3-5-9-14-15.3-25-15.3-10.2 0-19 5.1-24 13-5-4.7-11.8-7.6-19.3-7.6-8 0-15 3.6-20 9-3-1.4-6.6-2.2-10.3-2.2z"
        fill="white"
      />
    </g>
  </defs>

  <!-- Background strip (farthest) repeated look -->
  <rect x="0" y="0" width="1600" height="400" fill="url(#g-bg)" />

  <!-- Background subtle clouds (very faint, for depth) -->
  <g transform="translate(0,20)" opacity="0.35" filter="url(#softBlur)">
    <use href="#cloud-shape" transform="translate(0,50) scale(2.2 1.1)" fill="#ffffff" />
    <use href="#cloud-shape" transform="translate(420,20) scale(1.6 0.9)" fill="#ffffff" />
    <use href="#cloud-shape" transform="translate(820,60) scale(1.8 1.0)" fill="#ffffff" />
    <use href="#cloud-shape" transform="translate(1200,30) scale(1.7 0.95)" fill="#ffffff" />
  </g>

  <!-- Middle clouds -->
  <g transform="translate(0,0)" opacity="0.75">
    <use href="#cloud-shape" transform="translate(-60,110) scale(1.8 1.05)" fill="url(#g-mid)" />
    <use href="#cloud-shape" transform="translate(340,90) scale(1.4 0.95)" fill="url(#g-mid)" />
    <use href="#cloud-shape" transform="translate(760,120) scale(1.7 1.05)" fill="url(#g-mid)" />
    <use href="#cloud-shape" transform="translate(1160,100) scale(1.5 1.0)" fill="url(#g-mid)" />
  </g>

  <!-- Foreground clouds (crisp) -->
  <g transform="translate(0,0)" opacity="1">
    <use href="#cloud-shape" transform="translate(-120,150) scale(1.9 1.12)" fill="url(#g-front)" />
    <use href="#cloud-shape" transform="translate(280,140) scale(1.2 1.0)" fill="url(#g-front)" />
    <use href="#cloud-shape" transform="translate(620,160) scale(1.3 1.0)" fill="url(#g-front)" />
    <use href="#cloud-shape" transform="translate(920,150) scale(1.7 1.08)" fill="url(#g-front)" />
    <use href="#cloud-shape" transform="translate(1320,140) scale(1.1 0.95)" fill="url(#g-front)" />
  </g>

  <!-- Soft foreground sheen for realism -->
  <rect x="0" y="0" width="1600" height="400" fill="transparent" />
</svg>
